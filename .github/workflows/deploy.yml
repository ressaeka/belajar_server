
name: Deploy Backend to Debian VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout kode terbaru
        uses: actions/checkout@v5
        
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Salin .env ke direktori kerja runner
        run: cp /home/ressa/docker-lab/backend-docker/.env .env

      - name: Rebuild dan jalankan container
        run: docker compose -p backend-docker up -d --build
